services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skill_issue
      POSTGRES_USER: skill_issue
      POSTGRES_PASSWORD: skill_issue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_issue -d skill_issue"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://skill_issue:skill_issue@postgres:5432/skill_issue
      BIND_ADDRESS: 0.0.0.0:3000
      RUST_LOG: skill_issue_server=info,tower_http=info
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace:ro
      - ${SKILL_ISSUE_SCAN_ROOT:-..}:/scan-roots:ro

volumes:
  postgres-data:
